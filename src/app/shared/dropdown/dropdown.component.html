<div class="field select-field" [class.open]="isOpen">
  <label>{{ label }}</label>
  <div class="select-display" (click)="toggleOpen()">
    {{ selected }}
  </div>

  @if (isOpen) {
    <ul class="options-list">
      @for (option of options; track option) {
        <li (click)="selectOption(option)">
          {{ option }}
        </li>
      }
    </ul>
  }
</div>
